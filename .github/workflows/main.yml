name: Build and deploy ASP.Net Core app to Azure Web App - icons-softuni

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore ./icons/icons.csproj

      - name: Build
        run: dotnet build ./icons/icons.csproj --configuration Release

      - name: Publish
        run: dotnet publish ./icons/icons.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure SQL Connection String
        run: |
          az webapp config connection-string set \
            --name icons-softuni \
            --resource-group icons_dbResourceGroup \
            --settings DefaultConnection=${{ secrets.DEFAULT_CONNECTION }} \
            --connection-string-type SQLAzure

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'icons-softuni'
          slot-name: 'Production'
          package: .
